#! /usr/bin/python
PACKAGE = "rm_digtialimg_proc"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("make_dataset", bool_t, 0, "", False)
dataset_split = gen.enum([gen.const("train_set", int_t, 0, "train_set"),
                       gen.const("test_set", int_t, 1, "train_set")], "type")
gen.add("dataset_split", int_t, 0, "", 0, 0, 1, edit_method=dataset_split)
gen.add("image_id", int_t, 0, "", 1, 1, 9)
gen.add("continute", bool_t, 0, "", False)
gen.add("image_num", int_t, 0, "", 5000, 100, 9000)
exit(gen.generate(PACKAGE, "rm_digtialimg_proc", "Makedataset"))